{% load static optiexam_tags %}
<div id="notification-menu" class="notification-menu">
  <div class="notification-header">
    <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0;">In-App Notifications</h4>
    <span class="badge badge-primary">{{ unread_notifications_count|default:0 }} New</span>
  </div>
  <div class="notification-body" style="max-height: 280px; overflow-y: auto;">
    {% for alert in recent_notifications %}
      <div class="notification-item">
        <strong style="font-size: 0.85rem; color: var(--color-text-primary); display: block; margin-bottom: 2px;">{{ alert.title }}</strong>
        <p style="font-size: 0.8rem; color: var(--color-text-secondary); margin-bottom: 0;">{{ alert.message }}</p>
      </div>
    {% empty %}
      <div style="padding: 24px; text-align: center; color: var(--color-text-muted); font-size: 0.85rem;">
        {% icon 'check' 'icon-lg' %}
        <p style="margin-top: 8px; margin-bottom: 0;">You're all caught up! No unread alerts.</p>
      </div>
    {% endfor %}
  </div>
</div>
