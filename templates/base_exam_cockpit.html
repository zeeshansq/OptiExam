{% load static optiexam_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Examination Cockpit — OptiExam{% endblock %}</title>

  <!-- Local Fonts (Zero CDN) -->
  <link rel="stylesheet" href="{% static 'fonts/inter/inter.css' %}">
  <link rel="stylesheet" href="{% static 'fonts/outfit/outfit.css' %}">
  <link rel="stylesheet" href="{% static 'fonts/jetbrains-mono/jetbrains-mono.css' %}">

  <!-- Core & Cockpit Styles -->
  <link rel="stylesheet" href="{% static 'css/optiexam-core.css' %}">
  <link rel="stylesheet" href="{% static 'css/optiexam-theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/cockpit.css' %}">

  {% block extra_css %}{% endblock %}
</head>
<body class="cockpit-mode">
  {% block content %}{% endblock %}

  <!-- Core JavaScript Modules (Zero CDN) -->
  <script src="{% static 'js/anti-cheat-shield.js' %}"></script>
  <script src="{% static 'js/heartbeat-sync.js' %}"></script>
  <script src="{% static 'js/exam-cockpit.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
